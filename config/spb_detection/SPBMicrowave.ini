argument =

[disable_rf]
label = Disable RF
type = QPushButton
row = 6
col = 1
tooltip = Disable both SPB SynthHD channels through the spb_microwave process
rowspan = 1
colspan = 1
command = disable_rf
argument =

[dt]
label = Loop delay [s]
type = QLineEdit
row = 2
col = 1
