[device]
name = FlowController
label = Flow Controller
path = beam_source/gas
driver = FlowControllerCompatible
constr_params = address, port_api
correct_response = operational
slow_data = True
row = 0
column = 1
plots_queue_maxlen = 1000
max_NaN_count = 10
meta_device = False

[attributes]
column_names = time, flow signal, setpoint value
units = s, sccm, sccm

[address]
type = dummy
value = "10.10.222.12"

[port_api]
type = dummy
value = 8001

[enabled]
label = Device enabled
type = QCheckBox
tristate = True
row = 0
col = 0
value = 2

[HDF_enabled]
label = HDF enabled
type = QCheckBox
row = 1
col = 0
value = 1

[dt]
label = Loop delay [s]
type = QLineEdit
row = 2
col = 1
value = 1.0

[setpoint_value]
label = Setpoint [sccm]
type = QLineEdit
row = 3
col = 1
value = 0.0
enter_cmd = SetPointControl

[change_setpoint]
label = Set
type = QPushButton
row = 3
col = 2
argument = setpoint_value
command = SetPointControl
align = nsew

[neon_indicator]
label = (neon status?)
type = indicator
row = 9
col = 0
tooltip = None
rowspan = 1
colspan = 2
monitoring_command = NeonStatus()
return_values = flowing, not flowing, invalid, None
texts = Flowing, Not flowing, (neon status?), (neon status?)
states = enabled, disabled, error, disabled
