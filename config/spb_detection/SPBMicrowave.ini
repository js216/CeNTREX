[device]
name = SPB Microwave
label = SPB Microwave
path = microwaves
driver = SPBMicrowaveCompatible
constr_params = address, port_api
correct_response = SPB_MICROWAVE_EXPERIMENT_CONTROL
slow_data = True
row = 3
column = 1
plots_queue_maxlen = 1000
max_NaN_count = 0
meta_device = False
compound_dataset = True
double_connect_dev = True

[attributes]
column_names =
units =

[enabled]
label = Enabled
type = QCheckBox
tristate = True
row = 0
col = 0
tooltip = None
rowspan = None
colspan = None
value = 2

[HDF_enabled]
label = HDF
type = QCheckBox
row = 1
col = 0
tooltip = None
rowspan = None
colspan = None
value = True

[set_frequency]
label = Set frequency [GHz]
type = QLineEdit
row = 3
col = 1
tooltip = SynthHD output frequency, not doubled OMT frequency
rowspan = 1
colspan = 1
value = 13.32855
enter_cmd = set_frequency

[set_power]
label = Set detected power [dBm]
type = QLineEdit
row = 4
col = 1
tooltip = Process detected-power PID setpoint
rowspan = 1
colspan = 1
value = -28.0
enter_cmd = set_power

[enable_rf]
